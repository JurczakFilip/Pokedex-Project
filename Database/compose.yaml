services:
  db:
    image: mariadb:11.4
    container_name: pokedex_database
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: pokedex_db
      MARIADB_USER: pokedex_user
      MARIADB_PASSWORD: pokedex_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
