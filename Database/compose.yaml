services:
  db:
    image: mariadb:11.4
    container_name: pokedex_database
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: pokedex_db
      MARIADB_USER: root
      MARIADB_PASSWORD: root
    ports:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: